name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0.7
        target: esp32s3
        path: '.'
    - name: Merge binaries
      run: |
        cd build
        APP=$(find . -maxdepth 1 -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" ! -name "merged.bin" | head -1)
        pip install esptool
        python -m esptool --chip esp32s3 merge-bin -o /tmp/merged.bin \
          --flash-mode dio --flash-size 16MB \
          0x0 bootloader/bootloader.bin \
          0x8000 partition_table/partition-table.bin \
          0x10000 $APP
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: /tmp/merged.bin
