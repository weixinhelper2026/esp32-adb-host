name: Build ESP32 ADB Host
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.2.1
        target: esp32s3
        path: '.'
    - name: List bins
      run: find build -name "*.bin" -type f
    - name: Merge binaries
      run: |
        cd build
        APP_BIN=$(find . -maxdepth 1 -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" ! -name "merged.bin" | head -1)
        echo "App bin = $APP_BIN"
        pip install esptool
        python -m esptool --chip esp32s3 merge-bin -o merged.bin \
          --flash-mode dio --flash-size 16MB \
          0x0 bootloader/bootloader.bin \
          0x8000 partition_table/partition-table.bin \
          0x10000 $APP_BIN
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: build/merged.bin
